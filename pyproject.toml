[project]
name = "website-audit-agent"
version = "0.1.0"
description = "Audits one web page and produces a plain-English report with prioritised fixes."
readme = "README.md"
authors = [
    { name = "Grace Ihuoma Nwakama", email = "goodluckgrace08@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/website_audit_agent"]
